    <header class="topbar topbar-narrow">

            <a href="contact.html" aria-current="page">Contact</a>
        </nav>

    <main class="sheet sheet-narrow">
        <div class="contact-page">

            <h1>Get in touch</h1>
            <p class="lead">For roles, collaborations or questions about my work, reach me directly or send a message below. I usually reply within a few days.</p>

            <ul class="channels">
                <li><a href="mailto:cristiansimionimilani@gmail.com"><span>Email</span><strong>cristiansimionimilani@gmail.com</strong></a></li>
                <li><a href="https://www.linkedin.com/in/cristiansimioni/"><span>LinkedIn</span><strong>in/cristiansimioni</strong></a></li>
                <li><a href="https://github.com/cristiansimioni/"><span>GitHub</span><strong>cristiansimioni</strong></a></li>
            </ul>

            <form class="form" method="post" action="https://formspree.io/xdogzgnz">
                <div>
                    <label for="cname">Name</label>
                    <input type="text" id="cname" name="name" autocomplete="name" minlength="2" required>
                </div>
                <div>
                    <label for="cemail">Email</label>
                    <input type="email" id="cemail" name="_replyto" autocomplete="email" required>
                </div>
                <div class="full">
                    <label for="cmessage">Message</label>
                    <textarea id="cmessage" name="message" rows="8" required></textarea>
                </div>
                <button type="submit" class="btn full">Send message</button>
            </form>

        </div>
    </main>

    <footer class="footer">Cristian Simioni Milani &copy; <script>document.write(new Date().getFullYear())</script></footer>
